# Shopify app configuration. Used by the Shopify CLI (`shopify app config push`).
# Replace client_id with your app's API key from the Partner Dashboard, and the
# URLs with your deployed app URL.

name = "Polished"
client_id = "8666b78a6f43df292b628f439389b934"
application_url = "https://polished-production-5325.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_translations,write_translations"

[auth]
redirect_urls = [
  "https://polished-production-5325.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "products/create", "products/update" ]
  uri = "/api/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]
  uri = "/api/webhooks"

[pos]
embedded = false
